[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-battle-assistant"
version = "0.0.1"
description = "Pokemon battle environment and VGC infrastructure for future agent/RL workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Biank0" }
]

[project.scripts]
pba = "pokemon_battle_assistant.pba_cli:main"
pokemon-battle-assistant = "pokemon_battle_assistant.pba_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
