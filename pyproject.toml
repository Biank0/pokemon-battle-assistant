[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-battle-assistant"
version = "0.1.0"
description = "Pokemon battle environment, BSS/VGC infrastructure and LLM assistant for agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Biank0" }
]
dependencies = [
  "poke-env>=0.9,<0.16",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
pba = "pokemon_battle_assistant.pba_cli:main"
pokemon-battle-assistant = "pokemon_battle_assistant.pba_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["data", "battle_outputs", "replays", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",  # line length is enforced by formatter conventions; long Chinese strings exist
]

[tool.ruff.lint.per-file-ignores]
# scripts bootstrap sys.path before importing the local package on purpose
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["pokemon_battle_assistant"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["data", "battle_outputs", "frontend"]
